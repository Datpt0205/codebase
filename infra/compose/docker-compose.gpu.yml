# GPU override — chỉ dùng trên máy có NVIDIA GPU (Turing+):
#   docker compose --env-file .env \
#     -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.gpu.yml \
#     --profile full up -d
# Kèm .env: DW_TEI_EMBED_IMAGE=...:turing-1.6, DW_TEI_EMBED_DTYPE=float16
services:
  tei-embed:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
