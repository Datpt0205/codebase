[project]
name = "dw-docgen"
version = "0.1.0"
description = "Sandboxed execution service: runs model-written document-generation code with no network, no secrets and no database"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    # The document toolchain the sandboxed code reaches for. Declared here, not
    # borrowed from another package's tree: the image is built from this
    # project alone, so an undeclared import is a broken image.
    "python-docx>=1.1,<2",
    "python-pptx>=1.0,<2",
    "openpyxl>=3.1,<4",
    "lxml>=5.0",
    "pillow>=10.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dw_docgen"]
