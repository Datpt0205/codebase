[project]
name = "dw-memory"
version = "0.1.0"
description = "Long-term memory: memory items, write-candidate policy, retention (adapters arrive in phase 2)"
requires-python = ">=3.12"
dependencies = [
    "dw-kernel",
    "dw-knowledge",
    "dw-platform",
    # The memory ranker talks to Qdrant directly. Declared here rather than
    # borrowed through dw-knowledge: memory owns its own index, and a
    # dependency reached through another package is one nobody sees when they
    # ask what this one needs.
    "qdrant-client>=1.12,<1.15",
    # The retention policy is a YAML artifact this package loads itself.
    "pyyaml>=6,<7",
    "pydantic>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dw_memory"]
