schema_version: "1.0"
name: email.revise
version: "1.0.0"
summary: >-
  Sửa bản nháp email đã soạn theo yêu cầu của người dùng, ghi thành phiên bản
  mới. Bản cũ vẫn còn để đối chiếu.
when_to_use: >-
  Khi người dùng đã có bản nháp và muốn đổi gì đó - ngắn hơn, bớt trang trọng,
  thêm một ý, đổi lời mở đầu. Truyền artifact_id của bản nháp đang nói tới và
  chép lại yêu cầu của người dùng vào instruction.
when_not_to_use: >-
  Không dùng khi chưa có bản nháp nào - đó là email.draft. Không dùng để đổi
  người nhận: người nhận đã chốt ở bản đầu, muốn gửi cho người khác thì soạn
  bản nháp mới bằng email.draft.
returns: >-
  Bản nháp mới với version tăng thêm một, kèm tiêu đề và đoạn đầu. artifact_id
  giữ nguyên, nên lần sửa tiếp theo vẫn dùng đúng id đó.
required_scopes: [sales_chat.write]
# Same table and same reasoning as email.draft: a revision is another row in the
# chat's own artifact table, and an approval card per rewrite would make the
# revise loop cost more than writing the email by hand.
side_effect_level: internal
approval_policy: never
timeout_seconds: 120
max_retries: 0
idempotent: true
data_classification: [internal, customer]
