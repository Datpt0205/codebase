schema_version: "1.0"
name: meeting.compose_brief
version: "1.0.0"
summary: >-
  Dựng bản chuẩn bị trước cuộc họp cho hồ sơ đang mở: tình hình hiện tại, những
  điều nên nói, và những điều chưa biết nên hỏi. Trả về bản có id để người dùng
  sửa và duyệt.
when_to_use: >-
  Khi người dùng sắp đi gặp khách và cần nắm nhanh, hoặc hỏi "chuẩn bị gì cho
  buổi họp với khách này". Ghi chủ đề buổi họp vào focus bằng lời người dùng nếu
  họ có nói.
when_not_to_use: >-
  Không dùng để ghi lại cuộc họp ĐÃ diễn ra - đó là meeting.draft_minutes, và
  nó đọc từ tệp chứ không đọc từ hồ sơ. Không dùng để trả lời một câu hỏi cụ thể
  về hồ sơ; đó là crm.get_records, rẻ hơn và đúng việc hơn.
returns: >-
  Bản chuẩn bị kèm artifact_id, version, tiêu đề và đoạn mở đầu; hoặc yêu cầu bổ
  sung thông tin khi không đọc được hồ sơ nào từ hội thoại này.
required_scopes: [sales_chat.write]
# Writes the chat's own artifact table, like the other two producers. Nothing
# leaves the system, so nothing to approve.
side_effect_level: internal
approval_policy: never
timeout_seconds: 120
max_retries: 0
idempotent: true
data_classification: [internal, customer]
