schema_version: "1.0"
name: document.save
version: "1.0.0"
summary: >-
  Lưu một tệp .docx hoặc .pdf đã dựng trong thư mục làm việc thành bản có phiên
  bản, để người dùng mở, tải về hoặc yêu cầu sửa. Trả về thẻ tài liệu.
when_to_use: >-
  Ngay sau khi đã dựng xong tệp trong out/ và tự soi lại nội dung. Chưa gọi công
  cụ này thì tệp chỉ nằm trong thư mục nháp và người dùng không thấy gì cả.
when_not_to_use: >-
  Khi chưa dựng xong tệp, hoặc khi người dùng chỉ hỏi một câu và câu trả lời nằm
  gọn trong khung chat. Không dùng để gắn tệp vào hồ sơ CRM - đó là việc khác và
  cần người duyệt.
returns: >-
  artifact_id, phiên bản, tên tệp, kích thước, và mẫu nào đã dựng nó.
required_scopes: [sales_chat.write]
# Writes the chat's own artifact table and object storage, like the other
# producers. Nothing leaves this system, so nothing to approve; attaching the
# file to a CRM record is a separate tool and that one does need a human.
side_effect_level: internal
approval_policy: never
timeout_seconds: 120
max_retries: 0
idempotent: true
data_classification: [internal, customer]
