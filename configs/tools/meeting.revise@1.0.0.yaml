schema_version: "1.0"
name: meeting.revise
version: "1.0.0"
summary: >-
  Sửa biên bản đã dựng thành bản mới, giữ nguyên tệp nguồn và cuộc họp. Trả về
  version kế tiếp trên cùng một biên bản, bản cũ vẫn còn để đối chiếu.
when_to_use: >-
  Khi người dùng muốn đổi cách viết biên bản: gọn hơn, tách rõ việc của từng
  người, bỏ phần thừa, viết lại phần tóm tắt. Truyền đúng artifact_id của biên
  bản đang nói tới và ghi lại yêu cầu bằng lời người dùng.
when_not_to_use: >-
  Không dùng để đổi sang tệp khác hoặc cuộc họp khác - công cụ này không nhận
  tệp; muốn biên bản của cuộc họp khác thì gọi meeting.draft_minutes.
  Không dùng để thêm nội dung người dùng vừa kể trong chat: biên bản chỉ chứa
  những gì tệp nói, sửa cách viết thì được, sửa cuộc họp đã diễn ra thì không.
returns: >-
  Biên bản version kế tiếp, cùng hình thù kết quả với meeting.draft_minutes.
required_scopes: [sales_chat.write]
side_effect_level: internal
approval_policy: never
timeout_seconds: 240
max_retries: 0
idempotent: true
data_classification: [internal, customer]
