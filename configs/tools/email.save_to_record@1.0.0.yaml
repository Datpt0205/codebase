schema_version: "1.0"
name: email.save_to_record
version: "1.0.0"
summary: >-
  Lưu bản nháp email đã chốt vào hồ sơ CRM dưới dạng ghi chú, để cả đội đọc
  được và để lịch sử trao đổi nằm cùng chỗ với bản ghi.
when_to_use: >-
  Khi người dùng nói bản nháp đã ổn và muốn lưu lại vào hồ sơ. Truyền đúng
  artifact_id của bản nháp đang nói tới.
when_not_to_use: >-
  Không dùng để gửi email đi - hệ thống chưa gửi được, và công cụ này chỉ ghi
  vào CRM. Không dùng khi người dùng còn đang sửa; lưu bản chưa chốt thì hồ sơ
  đầy ghi chú nháp.
returns: >-
  Mã ghi chú vừa tạo, loại bản ghi và đường dẫn mở hồ sơ. Nội dung lấy từ bản
  nháp đã lưu, không lấy từ tham số.
required_scopes: [sales_chat.write]
# Writes the record of record, so a human approves it - the same rule every
# other CRM write in this worker follows. The tool takes only an artifact id:
# the body is read from the stored version, so what the approver saw on the card
# is what lands on the record, with no text argument that could drift between
# the two.
side_effect_level: critical
approval_policy: always
timeout_seconds: 30
max_retries: 0
idempotent: true
data_classification: [internal, customer]
