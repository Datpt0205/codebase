schema_version: "1.0"
name: document.open
version: "1.0.0"
summary: >-
  Nạp lại tệp nguồn của một bản tài liệu đã lưu vào thư mục làm việc, để sửa
  tiếp thay vì dựng lại từ đầu.
when_to_use: >-
  Khi người dùng muốn sửa một tài liệu đã có mà thư mục làm việc đang trống -
  thường là ở một lượt sau, hoặc sau khi container khởi động lại. Lấy
  artifact_id từ thẻ tài liệu.
when_not_to_use: >-
  Khi tệp nguồn vẫn còn trong thư mục làm việc; kiểm tra bằng ls trước, nạp lại
  thừa sẽ ghi đè bản đang sửa dở.
returns: >-
  artifact_id, phiên bản, tiêu đề và danh sách tệp đã nạp lại.
required_scopes: [sales_chat.read]
# Reads storage and writes a scratch directory that dies with the container.
side_effect_level: internal
approval_policy: never
timeout_seconds: 60
max_retries: 1
idempotent: true
data_classification: [internal, customer]
