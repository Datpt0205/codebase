schema_version: "1.0"
name: meeting.save_to_record
version: "1.0.0"
summary: >-
  Lưu biên bản đã chốt vào hồ sơ CRM dưới dạng ghi chú, để cả đội đọc được và
  để biên bản nằm cùng chỗ với bản ghi khách hàng.
when_to_use: >-
  Khi người dùng nói biên bản đã ổn và muốn lưu lại vào hồ sơ. Truyền đúng
  artifact_id của biên bản đang nói tới.
when_not_to_use: >-
  Không dùng khi người dùng còn đang sửa; lưu bản chưa chốt thì hồ sơ đầy biên
  bản nháp của cùng một cuộc họp. Không dùng để gửi biên bản cho ai - công cụ
  này chỉ ghi vào CRM.
returns: >-
  Mã ghi chú vừa tạo, loại bản ghi và đường dẫn mở hồ sơ. Nội dung lấy từ biên
  bản đã lưu, không lấy từ tham số.
required_scopes: [sales_chat.write]
# Writes the record of record, so a human approves it. The tool takes only an
# artifact id: the text is read from the stored version, so what the approver
# saw on the card is what lands, with no argument that could drift between the
# two. Minutes make this rule matter more than email did - a note saying the
# customer agreed to something is read later as evidence they did.
side_effect_level: critical
approval_policy: always
timeout_seconds: 30
max_retries: 0
idempotent: true
data_classification: [internal, customer]
