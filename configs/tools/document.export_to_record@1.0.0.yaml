schema_version: "1.0"
name: document.export_to_record
version: "1.0.0"
summary: >-
  Gắn một tài liệu đã lưu vào hồ sơ CRM mà nó được dựng cho, để cả đội thấy
  trong tab Tài liệu. Cần người duyệt trước khi chạy.
when_to_use: >-
  Khi người dùng đã xem tài liệu và bảo lưu vào hồ sơ. Chỉ cần artifact_id lấy
  từ thẻ tài liệu.
when_not_to_use: >-
  Khi người dùng mới chỉ xem hoặc còn muốn sửa. Không dùng để gửi cho khách -
  công cụ này chỉ lưu vào hồ sơ nội bộ.
returns: >-
  document_id trong CRM, tên tệp, và hồ sơ đã gắn vào.
required_scopes: [sales_chat.write, crm.document.write]
# The file leaves the chat and lands on the record of record, where the whole
# team sees it and nothing here can take it back. A person decides.
side_effect_level: critical
approval_policy: always
timeout_seconds: 60
max_retries: 0
idempotent: false
data_classification: [internal, customer]
