schema_version: "1.0"
name: meeting.draft_minutes
version: "1.0.0"
summary: >-
  Dựng biên bản cuộc họp từ MỘT tệp đã đính kèm trên hồ sơ - bản ghi âm đã bóc
  băng, hoặc ghi chú cuộc họp. Trả về biên bản có id để người dùng sửa và duyệt.
when_to_use: >-
  Khi người dùng nhờ làm biên bản, tóm tắt cuộc họp, hoặc hỏi "họp hôm qua chốt
  những gì" và câu trả lời phải là một văn bản chứ không phải vài dòng chat.
  Bỏ trống document_id nếu chưa chắc lấy tệp nào - công cụ sẽ hỏi lại.
when_not_to_use: >-
  Không dùng để trả lời một câu hỏi về nội dung tệp; đó là crm.search_attachments,
  rẻ hơn và đúng việc hơn. Không dùng khi hồ sơ chưa có tệp nào - công cụ sẽ nói
  chưa có, đừng dựng biên bản từ những gì người dùng vừa kể trong chat.
  Không tự đoán tệp: đoán sai thì biên bản đúng định dạng nhưng sai cuộc họp,
  và người đọc không có cách nào nhận ra.
returns: >-
  Một trong hai: biên bản kèm artifact_id, version, tiêu đề, đoạn tóm tắt đầu,
  tên tệp nguồn và cờ source_truncated; hoặc yêu cầu bổ sung thông tin kèm danh
  sách tệp có thật trên hồ sơ. Khi trả về yêu cầu bổ sung thì CHƯA có biên bản
  nào - hãy hỏi lại người dùng thay vì gọi lại với một id tự nghĩ ra.
  source_truncated = true nghĩa là tệp dài hơn một lượt đọc: phải nói với người
  dùng rằng biên bản mới bao phần đầu, đừng lờ đi.
required_scopes: [sales_chat.write]
# Writes a row in the chat's own artifact table, not the CRM record of record -
# the same reasoning as email.draft. An approval card per rewrite is how an
# assistant that revises becomes one nobody asks to revise.
side_effect_level: internal
approval_policy: never
# Reading a whole transcript and writing minutes from it is a longer generation
# than an email; measured against the email tool's 120s, which is the ceiling
# this doubles rather than a number picked for headroom.
timeout_seconds: 240
max_retries: 0
idempotent: true
data_classification: [internal, customer]
