schema_version: "1.0"
name: email.draft
version: "1.1.0"
summary: >-
  Soạn bản nháp email gửi một người liên hệ của khách hàng, dựa trên hồ sơ CRM
  và tài liệu đã đính kèm. Trả về bản nháp có id để người dùng sửa và duyệt.
when_to_use: >-
  Khi người dùng nhờ viết email cho khách - mọi loại: xin buổi gặp đầu tiên,
  chào hàng, tóm tắt cuộc họp, nhắc lại báo giá. Mô tả mục đích vào objective
  bằng đúng lời người dùng; không có công cụ riêng cho từng loại email.
when_not_to_use: >-
  Không dùng để GỬI email - công cụ này chỉ ra bản nháp, chưa gửi đi đâu cả.
  Không dùng khi người dùng hỏi thông tin về hồ sơ; đó là crm.get_records.
  Không tự đoán người nhận: bỏ trống contact_id nếu chưa chắc, công cụ sẽ hỏi lại.
  Bản nháp được nuôi bằng dữ kiện cấp KHÁCH HÀNG và các tệp trên hồ sơ, không
  bằng một thương vụ cụ thể. Từ 1.1.0 không còn tham số cơ hội nào - bản 1.0.0
  nhận `opportunity_id` rồi bỏ qua, nên model điền vào và tin rằng email nói về
  deal đó. Muốn email nhắc tới một deal thì viết điều đó vào `notes`.
returns: >-
  Một trong hai: bản nháp kèm artifact_id, version, tiêu đề, đoạn đầu và tên
  người nhận; hoặc yêu cầu bổ sung thông tin kèm câu hỏi và các lựa chọn có
  thật trong hệ thống. Khi trả về yêu cầu bổ sung thì CHƯA có bản nháp nào -
  hãy hỏi lại người dùng thay vì gọi lại công cụ với giá trị tự nghĩ ra.
required_scopes: [sales_chat.write]
# Writes a row in the chat's own artifact table, not the CRM record of record.
# A draft is versioned and discardable, and gating it behind an approval card
# would mean one click per rewrite - which is how an assistant that revises
# becomes an assistant nobody asks to revise.
side_effect_level: internal
approval_policy: never
timeout_seconds: 120
max_retries: 0
idempotent: true
data_classification: [internal, customer]
