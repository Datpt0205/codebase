schema_version: "1.0"
copy_id: platform.runtime
version: "1.3.0"

tool_description_template: |-
  {summary}
  Dùng khi: {when_to_use}
  Không dùng khi: {when_not_to_use}
  Trả về: {returns}

approval_reason_template: "cần duyệt trước khi chạy công cụ {tool}"

tool_rejected_template: >-
  Người duyệt đã từ chối {tool}, công cụ KHÔNG được chạy.{reason} Đừng gọi lại
  công cụ này; hãy báo lại cho người dùng.
rejection_reason_template: " Lý do: {comment}"

# Hai câu cho hai kiểu hỏng, vì bảo model xử lý chúng giống nhau là sai.
#
# Câu này viết cho những mã lỗi mà công cụ ĐÃ trả lời, và câu trả lời là một
# lời từ chối: không tìm thấy, sai tham số, trùng khoá, không đủ quyền. Gọi lại
# y hệt sẽ ra đúng như vậy. Nói rõ để model báo lại thay vì thử lại hoặc tự bịa.
tool_failed_template: >-
  Công cụ {tool} không trả về được dữ liệu ({code}): {message}. Đây là kết quả
  thật chứ không phải lỗi tạm thời. Hãy báo lại cho người dùng bằng lời, đừng
  gọi lại công cụ này với cùng tham số và tuyệt đối đừng tự nghĩ ra dữ liệu
  thay thế.

# Câu còn lại: công cụ KHÔNG trả lời được - quá hạn, dịch vụ phía sau chết,
# hoặc chính nó có bug. Trước 1.2.0 những lỗi này không bao giờ tới model:
# chúng ném thẳng ra, giết cả lượt, nên người dùng hỏi một câu rồi mất trắng
# câu trả lời giữa dòng.
#
# Điều model phải biết ở đây NGƯỢC HẲN câu trên: đây không phải một sự thật về
# dữ liệu. "Không tìm thấy khách hàng nào" là câu bị cấm sau một lần gọi hỏng.
#
# Không có {message}, có chủ ý. Một lỗi không có kiểu mang theo lời của thư
# viện bên dưới - đường dẫn, câu SQL, tên máy chủ nội bộ - mà câu này đi thẳng
# vào ngữ cảnh của model rồi ra màn hình. Chỉ tên công cụ và mã lỗi, hai thứ
# đều do mình đặt tên.
tool_unavailable_template: >-
  Công cụ {tool} không chạy được lần này ({code}). Đây KHÔNG phải kết quả tra
  cứu: hệ thống chưa đọc được dữ liệu, chứ không phải dữ liệu không tồn tại.
  Hãy nói với người dùng là phần này chưa lấy được, đừng rút ra bất kỳ kết luận
  nào từ lần gọi hỏng này, và tuyệt đối đừng tự nghĩ ra dữ liệu thay thế. Nếu
  phần còn lại của câu trả lời phụ thuộc vào nó thì thử lại NHIỀU NHẤT một lần.

# 1.3.0 thêm một câu, không đổi câu nào cũ.
#
# Câu cho một lệnh cần duyệt bị HOÃN. Cổng duyệt chỉ giữ được một việc chờ
# duyệt mỗi lần dừng: một khe `approval_request_id` trên run, một thẻ trên
# panel, và lệnh resume không mang id của lời hỏi. Khi model gọi hai công cụ
# cần duyệt trong cùng một bước, lệnh thứ hai trước đây vẫn chạy tới
# `interrupt()`: không có thẻ, không ai ký, và khi resume nó tranh lấy quyết
# định của thẻ kia. Đo được 2026-09-11 bằng test tái hiện.
#
# Nay chỉ lệnh cần duyệt ĐẦU TIÊN trong bước được chạy; các lệnh sau nhận câu
# này. Nó phải nói ngược với tool_failed ở trên: KHÔNG phải lời từ chối, và
# phải gọi lại sau khi việc kia được quyết, nếu không thì việc thứ hai biến mất
# mà người dùng tưởng đã xong.
approval_deferred_template: >-
  Công cụ {tool} CHƯA được chạy, và cũng chưa hỏng: cổng duyệt chỉ nhận một việc
  cần duyệt mỗi lần, và {pending} đang chờ người dùng quyết. Đây KHÔNG phải lời
  từ chối. Sau khi {pending} đã được duyệt hoặc từ chối, hãy gọi lại {tool} với
  đúng tham số cũ nếu việc đó vẫn cần làm. Đừng nói với người dùng là việc này
  đã xong.

